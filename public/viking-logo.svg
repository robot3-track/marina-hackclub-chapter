<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Hack Club Red-Orange Gradient for Squircle -->
    <linearGradient id="hc-badge-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C37" />
      <stop offset="100%" stop-color="#EC3750" />
    </linearGradient>

    <!-- Gold Helmet Gradient -->
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2C94C" />
      <stop offset="100%" stop-color="#D49A26" />
    </linearGradient>

    <!-- Horn Gradient -->
    <linearGradient id="horn-left" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E2B870" />
      <stop offset="100%" stop-color="#FFF3D1" />
    </linearGradient>
    <linearGradient id="horn-right" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2B870" />
      <stop offset="100%" stop-color="#FFF3D1" />
    </linearGradient>

    <!-- Helmet Bowl Gradient -->
    <linearGradient id="helmet-bowl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5C3B27" />
      <stop offset="100%" stop-color="#3D2416" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    
    <filter id="text-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Left Horn -->
  <path d="M 125 180 C 70 160 40 80 80 20 C 100 60 120 110 150 145 Z" fill="url(#horn-left)" stroke="#B88022" stroke-width="4" stroke-linejoin="round" />

  <!-- Right Horn -->
  <path d="M 275 180 C 330 160 360 80 320 20 C 300 60 280 110 250 145 Z" fill="url(#horn-right)" stroke="#B88022" stroke-width="4" stroke-linejoin="round" />

  <!-- Helmet Dome / Bowl -->
  <path d="M 120 200 C 120 100 280 100 280 200 Z" fill="url(#helmet-bowl)" stroke="#2B180E" stroke-width="4" />

  <!-- Vertical Gold Center Strap -->
  <rect x="182" y="102" width="36" height="98" rx="4" fill="url(#gold-gradient)" stroke="#B88022" stroke-width="3" />
  
  <!-- Rivets on Center Strap -->
  <circle cx="200" cy="120" r="4.5" fill="#8C5C10" />
  <circle cx="200" cy="150" r="4.5" fill="#8C5C10" />
  <circle cx="200" cy="180" r="4.5" fill="#8C5C10" />

  <!-- Helmet Bottom Rim / Band -->
  <rect x="108" y="190" width="184" height="32" rx="10" fill="url(#gold-gradient)" stroke="#B88022" stroke-width="4" filter="url(#drop-shadow)" />

  <!-- Red Squircle Badge ("h" Logo) -->
  <rect x="115" y="215" width="170" height="190" rx="55" fill="url(#hc-badge-gradient)" filter="url(#drop-shadow)" />

  <!-- White 'h' Letter -->
  <text x="200" y="365" 
        font-family="'Phantom Sans', 'Plus Jakarta Sans', 'Segoe UI', sans-serif" 
        font-size="160" 
        font-weight="900" 
        fill="#FFFFFF" 
        text-anchor="middle"
        filter="url(#text-shadow)">h</text>
</svg>
