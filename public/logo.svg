<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Hack Club Signature Red Squircle Base (1:1 Ratio) -->
  <rect width="512" height="512" rx="112" fill="#EC3750"/>
  
  <!-- Subtle Inner Highlight Rim -->
  <rect x="16" y="16" width="480" height="480" rx="96" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="8"/>
  
  <!-- Left Viking Horn (Gold) -->
  <path d="M 148 150 C 110 110 82 60 70 30 C 105 50 142 95 175 125 Z" fill="#F1C40F" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
  
  <!-- Right Viking Horn (Gold) -->
  <path d="M 364 150 C 402 110 430 60 442 30 C 407 50 370 95 337 125 Z" fill="#F1C40F" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>

  <!-- Sleek Viking Helmet Dome over Top of 'H' -->
  <path d="M 172 170 C 172 110 340 110 340 170 V 205 H 172 V 170 Z" fill="#FFFFFF"/>
  <path d="M 156 195 H 356 V 220 C 356 228 348 235 340 235 H 172 C 164 235 156 228 156 220 V 195 Z" fill="#252429"/>
  <!-- Helmet Nose Guard -->
  <path d="M 242 195 H 270 V 260 L 256 275 L 242 260 V 195 Z" fill="#252429"/>
  <!-- Visor Eye Slots -->
  <rect x="180" y="204" width="46" height="15" rx="4" fill="#17171D"/>
  <rect x="286" y="204" width="46" height="15" rx="4" fill="#17171D"/>

  <!-- Hack Club 'h' Letterform Body (Integrated directly into the helmet base) -->
  <!-- Left Stem -->
  <rect x="172" y="230" width="56" height="200" rx="16" fill="#FFFFFF"/>
  
  <!-- Right Arch of 'h' -->
  <path d="M 220 310 C 220 260 328 260 328 310 V 430 H 272 V 320 C 272 298 220 298 220 320 V 430 H 172 V 310 Z" fill="#FFFFFF"/>
  
  <!-- Small Flag Accent on Top of Helmet -->
  <path d="M 256 75 L 256 125" stroke="#F1C40F" stroke-width="5" stroke-linecap="round"/>
  <path d="M 256 78 L 298 94 L 256 110 Z" fill="#F1C40F"/>
</svg>
